name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan]
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
        include:
          - { os: macos-26, compiler: appleclang, preset: debug }
          - { os: macos-26, compiler: appleclang, preset: release }
          - { os: macos-26, compiler: appleclang, preset: asan }
          - { os: macos-26, compiler: appleclang, preset: tsan }
    steps:
      - uses: actions/checkout@v5

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libopencv-dev

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list opencv >/dev/null 2>&1 || brew install opencv

      # ONNX Runtime comes from this repo's release; the model is downloaded at configure time.
      - name: Cache model
        uses: actions/cache@v6
        with:
          path: models
          key: model-yolox-nano-c789161e

      - name: Select compiler
        run: |
          case "${{ matrix.compiler }}" in
            gcc)   echo "CC=gcc"   >> "$GITHUB_ENV"; echo "CXX=g++"     >> "$GITHUB_ENV" ;;
            clang) echo "CC=clang" >> "$GITHUB_ENV"; echo "CXX=clang++" >> "$GITHUB_ENV" ;;
            appleclang) ;;  # system default
          esac

      # Ubuntu 24.04 kernels use high mmap ASLR entropy, which makes TSan abort with
      # "unexpected memory mapping". Lowering it is the standard workaround.
      - name: Relax ASLR for TSan
        if: runner.os == 'Linux' && matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Compiler version
        run: ${CXX:-c++} --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  coverage:
    name: coverage (gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pipx install gcovr==8.8
      - name: Build, test and measure
        run: scripts/coverage.sh
      - name: Job summary
        run: cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage/report

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Pinned to match the local Homebrew clang-format major version (23.x).
      - run: pipx install clang-format==23.1.5
      - name: Check formatting
        run: |
          git ls-files '*.hpp' '*.h' '*.cpp' '*.cc' \
            | xargs -r clang-format --dry-run --Werror
